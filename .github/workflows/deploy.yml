name: Deploy (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # usado pela publicação de artigos (push do bot não dispara o deploy)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Verificar o site (bloqueia o deploy se houver erro)
        run: python3 scripts/check_site.py

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            CLAUDE.md
            .claude/**
            scripts/**
            template_loft.html
